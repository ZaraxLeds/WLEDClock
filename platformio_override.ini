; LedClock build configuration for WLED 0.15.x
; This file overrides settings in platformio.ini for the LED Clock project

[platformio]
default_envs = ledclock

[env:ledclock]
extends = env:esp32dev
build_flags =
    ${common.build_flags}
    ${esp32_idf_V4.build_flags}
    -D WLED_RELEASE_NAME=\"LedClock\"
    -D WLED_BRAND=\"wledclocktest\"
    -D MDNS_NAME=\"wledclocktest\"
    -D DEFAULT_LED_COUNT=903
    -D LEDPIN=16
    -D ABL_MILLIAMPS_DEFAULT=2500
    -D SERVERNAME=\"wledclocktest\"
    ; LedClock specific pins
    -D BUZZER_PIN=12
    -D BRIGHTNESS_PIN=34


; Custom usermods to include
custom_usermods = ledclock
